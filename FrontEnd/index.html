<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AW Ali Company — Enterprise Website & Portal</title>
    <meta name="description" content="Official website of AW Ali Company delivering innovative solutions across Real Estate, Consulting, Education & Training, and International Trade." />
    <meta property="og:title" content="AW Ali Company — Enterprise Website & Portal" />
    <meta property="og:description" content="Official website of AW Ali Company delivering innovative solutions across Real Estate, Consulting, Education & Training, and International Trade." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('aw_ali_theme');
          var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8F9FC] text-[#171A2B] antialiased selection:bg-[#FF7817] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
